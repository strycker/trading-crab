[build-system]
requires = ["setuptools>=68,<76", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-crab-lib"
version = "0.2.0"
description = "Trading-Crab platform library: data build, features, allocation and the weekly page"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{ name = "Strycker" }]
keywords = ["finance", "macroeconomics", "portfolio", "time-series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.urls]
Homepage   = "https://github.com/strycker/trading-crab"
Repository = "https://github.com/strycker/trading-crab"
Issues     = "https://github.com/strycker/trading-crab/issues"

# The package IS this directory. The 0.1.x `packages.find where = [".."]` glob escaped the project root and
# shipped an empty wheel, so every subpackage is listed by name: add one line per new subpackage.
[tool.setuptools]
package-dir = {"trading_crab_lib" = "."}
packages = ["trading_crab_lib", "trading_crab_lib.platform"]

[tool.setuptools.package-data]
trading_crab_lib = ["py.typed"]
