[build-system]
requires = ["setuptools>=68,<76", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-crab"
version = "0.2.0"
description = "Weekly, guidance-only portfolio advice: the tradingcrab command line"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{ name = "Strycker" }]
keywords = ["finance", "trading-crab", "macroeconomics", "portfolio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
# pandas and the rest arrive through the library
dependencies = ["trading-crab-lib>=0.2.0"]

[project.scripts]
tradingcrab = "trading_crab.cli:main"

[project.urls]
Homepage   = "https://github.com/strycker/trading-crab"
Repository = "https://github.com/strycker/trading-crab"
Issues     = "https://github.com/strycker/trading-crab/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "build"]
notebook = ["jupyterlab", "ipykernel"]

# The app package only; the library has its own pyproject.toml in src/trading_crab_lib/
[tool.setuptools.packages.find]
where   = ["src"]
include = ["trading_crab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "realdata: needs a real `tradingcrab build` in this checkout's data/ (skipped otherwise)",
    "network: may open sockets (the conftest guard blocks every other test)",
]
filterwarnings = ["error::FutureWarning"]

[tool.ruff]
line-length = 127
target-version = "py310"
extend-exclude = ["legacy"]   # frozen reference, never linted (D-14)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E741"]
