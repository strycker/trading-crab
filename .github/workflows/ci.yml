name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]  # minimum + newest supported

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "src/trading_crab_lib[all,dev]"
          pip install -e ".[dev]"
          pip install ruff mypy

      - name: Lint (ruff)
        run: |
          ruff check src tests

      - name: Test
        run: |
          pytest tests/ -v --tb=short

      - name: Type check (informational for now)
        run: |
          mypy src/trading_crab src/trading_crab_lib --ignore-missing-imports --no-error-summary || true

  build-distributions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build both packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build . --outdir dist-app
          python -m build ./src/trading_crab_lib --outdir dist-lib
