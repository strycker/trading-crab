name: CI

# One run per pushed commit; a PR shows the checks of its head commit. No secrets anywhere in CI.
on:
  push:
    branches: ["main", "claude/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]  # minimum (resolves pandas 2) and newest (resolves pandas 3)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            src/trading_crab_lib/pyproject.toml

      - name: Install both packages
        run: |
          python -m pip install --upgrade pip
          pip install -e src/trading_crab_lib -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Test
        run: pytest tests -q -p no:cacheprovider

  build-distributions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build both packages
        run: |
          python -m pip install --upgrade pip build
          python -m build . --outdir dist-app
          python -m build src/trading_crab_lib --outdir dist-lib

      - name: Install the wheels in a fresh venv and import them from site-packages
        run: bash scripts/check_wheels.sh dist-lib dist-app
